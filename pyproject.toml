[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcts-framework"
version = "0.1.0"
description = "Clean, modular MCTS framework for materials discovery (crystals, molecules, alloys)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [
    {name = "Los Alamos National Laboratory"},
]
keywords = ["mcts", "materials", "optimization", "machine-learning", "monte-carlo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# Core dependencies (required)
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "typer>=0.9",
]

[project.optional-dependencies]
# Intermetallic crystal structure support
intermetallic = [
    "ase>=3.22",
    "spglib>=2.0",
    "mace-torch>=0.3",
    "matbench-discovery>=1.0",
    "pymatgen>=2024.1.1",
]

# Molecular structure support
molecule = [
    "rdkit>=2023.0",
]

# Ternary superhydride support (ELF descriptors + host substitution)
superhydride = [
    "ase>=3.22",
    "spglib>=2.0",
    "scipy>=1.10",
]

# Visualization and analysis
viz = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "networkx>=3.0",
]

# Development and testing
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

# Install everything
all = [
    "mcts-framework[intermetallic,molecule,superhydride,viz,dev]"
]

[project.scripts]
mcts-run = "mcts_framework.cli.main:app"

[project.urls]
Homepage = "https://github.com/lanl/mcts-framework"
Documentation = "https://github.com/lanl/mcts-framework/blob/main/README.md"
Repository = "https://github.com/lanl/mcts-framework"
Issues = "https://github.com/lanl/mcts-framework/issues"

[tool.setuptools]
packages = [
    "mcts_framework",
    "mcts_framework.core",
    "mcts_framework.intermetallic",
    "mcts_framework.molecule",
    "mcts_framework.superhydride",
    "mcts_framework.cli",
    "mcts_framework.postprocessing",
]
# Note: intermetallic, molecule and superhydride import their heavy deps
# (ase/mace/pymatgen, rdkit/molecule-modifier, ase/spglib/scipy) lazily; the
# core stays lightweight.
package-dir = {"" = "src"}

[tool.setuptools.package-data]
mcts_framework = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I", "N", "UP"]
ignore = []
