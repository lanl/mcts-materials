# Example configuration: intermetallic crystal-structure search.
#
# Run with:
#   mcts-run run --config examples/config_intermetallic.yaml
#
# As shipped this uses rollout_method: rdos, which needs only the [intermetallic]
# extra (ase, spglib), the bundled CIF, and a DOSCAR peaks CSV - NO Materials
# Project API key. To search by thermodynamic stability instead, switch
# rollout_method to 'ehull' or 'ehull_rdos' and provide mp_api_key (these also
# pull in mace-torch, pymatgen, matbench-discovery for live energy calcs).

material_type: intermetallic

mcts:
  iterations: 1000
  exploration_constant: 0.1
  termination_limit: 60
  selection_mode: ucb1          # ucb1 | puct | epsilon_greedy | boltzmann
  rollout_depth: 1
  n_rollout: 5
  rollout_aggregation: max      # max (optimistic, best reachable) | mean
  search_mode: fast             # fast (stop at convergence, fewest DFT calls)
                                # | thorough (full budget, broader top-N list)
  seed: 0
  output_dir: mcts_results_intermetallic

intermetallic:
  structure_path: examples/mat_Pb6U1W6_sg191.cif
  f_block_mode: u_only          # u_only | lanthanides_u | lanthanides_u_no_wrap
                                # | full_f_block
  move_step: 1                  # max jump per substitution along TM/Group-IV/
                                # lanthanide axes (1 = adjacent; 3 = extended)
  u_bridge: narrow              # lanthanide/U modes: which lanthanides U links
                                # to - narrow (Nd only) | wide (Nd/Gd/Er)
  rollout_method: rdos          # rdos (no API key) | ehull | ehull_rdos
                                # | ehull_rdos_product (multiplicative:
                                #   ehull_reward * r_DOS, needs key+DOSCAR)
  beta: 1.0                     # E_hull weight (ehull_rdos only)
  gamma: 0.0001                 # rDOS weight  (ehull_rdos only)

  # Data / credentials:
  rdos_method: peak_sum   # published peak-sum reward; the default is now bandpass
  doscar_data_path: examples/doscar_peaks_data_with_U.csv  # required for rdos/ehull_rdos
  mp_api_key: null              # required for ehull/ehull_rdos (not rdos)
  cache_path: null              # optional MACE energy cache CSV
