# Example configuration: ternary superhydride search by estimated Tc.
#
# Run with:
#   mcts-run run --config examples/config_superhydride.yaml
#
# The reward is the ELF-based Tc fit of Belli et al., Ann. Phys. (Berlin) 2025,
# 537, e00280, Eq. 2 - no stability term at this stage. It needs four
# descriptors per candidate: phi, phi* (from an ELF cube), H_DOS (from a
# projected DOS) and H_f (free, from the composition).
#
# TWO FILES YOU MUST SUPPLY:
#
#   structure_path        A relaxed hydride template (CIF) with two distinct
#                         host sites - the search substitutes its non-hydrogen
#                         sublattice and leaves the hydrogen motif alone. This
#                         choice sets the ceiling: Tc scales as H_f^3, and H_f
#                         is fixed by the template.
#
#   descriptor_table_path (evaluator: table) A CSV of precomputed descriptors:
#
#                             formula,phi,phi_star,h_dos
#                             LaBeH8,0.527,0.738,0.724
#                             CaH6,0.811,0.811,0.793
#
#                         Compositions absent from it score 0.0, so a first run
#                         with no table just enumerates which compositions the
#                         search wants computed. Compute those with DFT, extend
#                         the table, and run again.
#
#                         Set evaluator: quantum_espresso instead to compute
#                         them on demand - see the section at the bottom.
#
# Needs only the [superhydride] extra (ase, spglib, scipy) - no API keys.

material_type: superhydride

mcts:
  iterations: 1000
  exploration_constant: 0.1     # assumes O(1) rewards; see normalize_reward
  termination_limit: 60
  selection_mode: ucb1          # ucb1 | puct | epsilon_greedy | boltzmann
  rollout_depth: 1
  n_rollout: 5
  rollout_aggregation: max      # max (optimistic, best reachable) | mean
  search_mode: fast             # fast (stop at convergence) | thorough
  seed: 0
  output_dir: mcts_results_superhydride

superhydride:
  structure_path: path/to/your_template.cif

  host_palette: high_tc         # high_tc (electropositive + covalent, the two
                                #   classes that reach high Tc - default)
                                # | electropositive (alkali, alkaline earth,
                                #   rare earth, early TMs, Al, Th/U)
                                # | covalent (p-block X-H formers)
                                # | all (adds late TMs -> low-Tc interstitial
                                #   hydrides; mostly wasted evaluations)

  preserve_distinct_hosts: true # keep a ternary ternary; false lets the search
                                # collapse onto the binary hydrides it contains

  normalize_reward: true        # Tc / 427.7 K -> reward in (0, 1]. Ranking is
                                # unchanged. Set false for raw kelvin, and then
                                # raise exploration_constant by ~2 orders of
                                # magnitude or the search goes greedy.

  evaluator: table              # table (read descriptor_table_path)
                                # | quantum_espresso (compute per candidate)

  descriptor_table_path: null   # CSV: formula,phi,phi_star,h_dos

  # Only read when evaluator: quantum_espresso. Every numerical field here is
  # the scientific protocol, not a tuning knob - two networking values computed
  # at different cutoffs, meshes or pseudopotential families are not a
  # comparison. Keeping them in the config is what makes a campaign replayable.
  #
  # Cluster paths fall back to the environment, so they can stay out of a
  # shared config: ESPRESSO_PSEUDO, QE_BIN_DIR, QE_ENV_SETUP. On Artemis:
  #
  #   export QE_BIN_DIR=/nfs/turbo/coe-venkvis/changwex/qe-build/qe-7.3.1/bin
  #   export QE_ENV_SETUP="module load gcc/13.2.0 openmpi/4.1.6"
  #   export ESPRESSO_PSEUDO=/path/to/your/upf/files
  #
  # quantum_espresso:
  #   pseudo_dir: null          # or ESPRESSO_PSEUDO
  #   pseudo_files: {}          # element -> UPF name; else "<Element>.upf"
  #   bin_dir: null             # or QE_BIN_DIR, else PATH
  #   environment_setup: null   # or QE_ENV_SETUP
  #   mpi_command: mpirun
  #   ranks: 4                  # clamped per structure to the FFT plane count
  #   timeout_s: 7200
  #
  #   ecutwfc: 90.0             # Ry. The paper's value and the real cost knob.
  #   ecutrho: 360.0            # Ry. Ratio 4 is exact for NORM-CONSERVING
  #                             # pseudos; ultrasoft/PAW need 8-12x (the paper
  #                             # used 900 with PAW). Check pseudo_type in the
  #                             # UPF header before trusting this.
  #   degauss: 0.02             # Ry, Methfessel-Paxton. Converged together
  #                             # with the k-mesh, then held fixed.
  #   conv_thr: 1.0e-10
  #   kspacing_scf: 0.2262      # 1/A (2*pi convention) = the paper's 2pi*0.036
  #   kspacing_nscf: 0.1131     # = the paper's 2pi*0.018
  #
  #   pressure_gpa: 200.0       # REQUIRED when relax is true: a hydride
  #                             # relaxed to 0 GPa is a different material.
  #   relax: true
  #   relax_passes: 2           # 2 is the minimum that sheds the Pulay error
  #                             # in the stress; one pass can be 100+ kbar out.
  #
  #   work_root: /scratch/.../qe_runs   # one directory per candidate
  #   cache_path: qe_descriptors.csv    # resumes a campaign, and replays as a
  #                                     # descriptor_table_path afterwards
  #   keep_scratch: false
  #   keep_cube: false          # cubes are tens of MB each
